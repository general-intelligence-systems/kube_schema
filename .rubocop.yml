require:
  - ./cops/begin_block_assignment.rb
  - ./cops/comment_structure.rb
  - ./cops/constant_matches_path.rb
  - ./cops/multiline_method_arguments.rb
  - ./cops/no_conditional_assignment.rb
  - ./cops/no_console_logging.rb
  - ./cops/no_modifier_if.rb
  - ./cops/no_return.rb
  - ./cops/use_tap.rb

AllCops:
  DisabledByDefault: true
  NewCops: disable
  SuggestExtensions: false
  TargetRubyVersion: 3.2
  Exclude:
    - docs/**/*
    - Gemfile
    - .direnv/**/*
    - examples/**/*
    - result
    - vendor/**/*
    - tmp/**/*
    - node_modules/**/*
    - app/javascript/**/*
    - reference/**/*
    - references/**/*   # vendored upstream checkouts, with configs of their own
    - pkg/**/*
    - bin/bundle           # generated by Bundler; regenerating would revert any edits
    - cops/comment_structure.rb        # comment cop, copied verbatim; its own house style
    - cops/support/prism_source.rb     # support for the comment cop, likewise

# Bans `lvar = begin ... end`. Force
#   begin
#     lvar = ...
#   rescue ...
#   end
# so the rescue/ensure clauses aren't hidden behind an assignment target.
Local/BeginBlockAssignment:
  Enabled: true

# Every file defines the constant its path spells (Zeitwerk's rule), so a reader
# can go from a constant to a file and back without grepping. `xx_name.rb`
# numeric prefixes are load-order only and are stripped before comparing.
Local/ConstantMatchesPath:
  Enabled: true
  Include:
    - lib/**/*.rb
  Roots:
    - lib
  # Plain camel case, as Zeitwerk infers it: `ssh_key.rb` is `SshKey`. Add an
  # entry only alongside renaming the files it affects.
  # Only real acronyms the code already spells out. Adding one means renaming
  # every constant that uses that word, so it is not a free knob.
  Inflections:
    oidc: OIDC
    csrf: CSRF
    id: ID
  IgnorePaths:
    # Reopens Sinatra/Sequel, or must live in a third party's namespace.
    - sinatra/**/*
    - sequel_ext.rb
    - models/plugins/**/*
    # Reopens the core Hash class (monkey patch).
    - kube/monkey_patches.rb
    # gem_kit's conventional lib/<gem_name>/version.rb path, which `gem kit
    # bump` depends on; it does not nest under kube/schema/version.rb.
    - kube_schema/version.rb
    - ratalada/contrib/inertia.rb
    - ratalada/contrib/inertia/core_ext.rb
    - ratalada/protocol_http_ext.rb
    - ratalada/contrib/router/file_based/expo.rb
    - ratalada/contrib/router/file_based/grape_adapter.rb
    - ratalada/contrib/router/file_based/sinatra_adapter.rb
    # Public require paths (`require "ratalada/roda"`) that register a
    # Frontends::/Backends:: constant. The path is the gem's API, so it cannot
    # move to ratalada/frontends/roda.rb to spell the namespace out.
    - ratalada/builder.rb
    - ratalada/grape.rb
    - ratalada/hanami.rb
    - ratalada/roda.rb
    - ratalada/sinatra.rb
    - ratalada/async.rb
    - ratalada/falcon.rb
    - ratalada/puma.rb
    - ratalada/webrick.rb

# Bans `lvar = if ...` / `lvar = case ...`, ternaries included. Assign inside
# each branch instead, so the branches sit under the assignment rather than off
# its right edge. Wider than the built-in Style/ConditionalAssignment, which
# ignores conditionals with a missing branch (`x = if cond ... end`).
Local/NoConditionalAssignment:
  Enabled: true

# Bans modifier `if` / `unless` (trailing conditional). Force full block
# form so guards can't hide off the right edge of a long line.
Local/NoModifierIf:
  Enabled: true

# Bans the `return` keyword. The method's last expression is its return
# value; guards must be structural (if/unless/case), not short-circuits.
Local/NoReturn:
  Enabled: true

# Bans logging at the `Console` singleton (Console.info, Console.logger.warn).
# console-adapter-rails makes `Rails.logger` a Console logger already, so the
# direct call gains nothing and skips the adapter's tagging, silencing and
# per-environment config.
Local/NoConsoleLogging:
  Enabled: true

# Requires `tap` where a method assigns a local on its first line and returns
# that same local on its last. Skipped when the body reassigns the variable —
# `tap` yields the original object, so that rewrite would change the result.
Local/UseTap:
  Enabled: true

Local/CommentStructure:
  Enabled: true

  # Cop source files narrate AST/regex logic in prose; they predate this cop
  # and aren't written to its summary-length rules.
  Exclude:
    - cops/**/*

  MaximumWords: 10
  BaseWords: 10
  WordsPerLine: 3
  ModuleWords: 10

  Wrapping:
    Enabled: true
    Exclude:
      - "bin/*"
      - "exe/*"

  Length:
    Enabled: true
    Exclude:
      - "bin/*"
      - "exe/*"

  Annotations:
    Enabled: true
    Include:
      - "lib/**/*.rb"

# Multi-line method calls: arg #1 on its own line, every subsequent arg too.
# Bans:
#   engine.handle_failure(task_id, worker_id,
#                         error_message: "...",
#                         retries:       0)
# In favour of:
#   engine.handle_failure(
#     task_id,
#     worker_id,
#     error_message: "...",
#     retries: 0,
#   )
Layout/FirstMethodArgumentLineBreak:
  Enabled: true

Layout/MultilineMethodArgumentLineBreaks:
  Enabled: true

# The two cops above only fire once a call is ALREADY multi-line — see
# FirstElementLineBreak#check_children_line_break, which returns early when the
# call opens and closes on one line. So a five-argument call stays legal until
# it hits Layout/LineLength, whose autocorrect then wraps at whatever column
# 120 lands on, mid-argument. This cop makes the argument count the trigger:
# past MaxArguments the call must break, and the cops above and below decide
# where the pieces sit.
Local/MultilineMethodArguments:
  Enabled: true
  MaxArguments: 3

# Same rule for hash literals.
Layout/FirstHashElementLineBreak:
  Enabled: true

Layout/MultilineHashKeyLineBreaks:
  Enabled: true

# The four cops above decide WHERE a call/hash breaks; these decide where the
# broken-out lines SIT. Without them `rubocop -a` splits the arguments and
# leaves them at whatever column they used to occupy — in practice column 0.
# Fixed indentation (one step past the line that opened the call) is what makes
# the style above readable, and it is what the examples in this file show.
Layout/FirstArgumentIndentation:
  Enabled: true
  EnforcedStyle: consistent

Layout/ArgumentAlignment:
  Enabled: true
  EnforcedStyle: with_fixed_indentation

Layout/FirstHashElementIndentation:
  Enabled: true
  EnforcedStyle: consistent

# `table`, NOT the default `key`: values line up in a column
#   path:   relative_path(...),
#   sha:    data["sha"],
#   commit: data["commit"],
# The default would strip that padding back to a single space.
Layout/HashAlignment:
  Enabled: true
  EnforcedColonStyle: table
  EnforcedHashRocketStyle: table

Layout/MultilineMethodCallBraceLayout:
  Enabled: true

# `indented_internal_methods`, NOT the default `normal`: methods below a
# `private` / `protected` keyword are indented one step further than the
# keyword, so the visibility boundary is visible down the left edge.
#   private
#
#     def helper
#     end
# The default would pull those back level with the public methods.
Layout/IndentationConsistency:
  Enabled: true
  EnforcedStyle: indented_internal_methods

Layout/IndentationWidth:
  Enabled: true

# …and where the closing `)` / `}` / `]` land, so a split call closes at the
# indentation of the line that opened it rather than at column 0.
Layout/ClosingParenthesisIndentation:
  Enabled: true

Layout/MultilineHashBraceLayout:
  Enabled: true
  EnforcedStyle: new_line

Layout/FirstArrayElementIndentation:
  Enabled: true
  EnforcedStyle: consistent

Layout/MultilineArrayBraceLayout:
  Enabled: true
  EnforcedStyle: new_line

# The trailing comma the examples above show — adding an argument then touches
# one line in the diff, not two.
Style/TrailingCommaInArguments:
  Enabled: true
  EnforcedStyleForMultiline: consistent_comma

Style/TrailingCommaInHashLiteral:
  Enabled: true
  EnforcedStyleForMultiline: consistent_comma

# Splitting a line must not leave whitespace hanging off the end of it.
Layout/TrailingWhitespace:
  Enabled: true
