# Helm charts that contain CRDs. Each entry is rendered via `helm template`
# and appended to data/crds/00-all-crds.yaml before the k3s extraction step.
#
# Fields:
#   name:      release name passed to `helm template`
#   chart:     OCI ref, or chart name when `repo` is set
#   repo:      classic Helm repo URL (omit for OCI charts referenced fully in `chart`)
#   version:   chart version
#   namespace: namespace for template rendering (optional, defaults to "default")

# Agentgateway
- name: agentgateway-crds
  chart: oci://cr.agentgateway.dev/charts/agentgateway-crds
  version: v1.1.0
  namespace: agentgateway-system

# Kubescape (CRDs ship inside the chart's crds/ dir + alert subcharts;
# requires --include-crds, handled by bin/03-download-helm-crds)
- name: kubescape
  chart: kubescape-operator
  repo: https://kubescape.github.io/helm-charts
  version: 1.40.2
  namespace: metrics
